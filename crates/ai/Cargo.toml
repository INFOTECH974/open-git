[package]
name = "open-git-ai"
description = "Commit messages written by a language model, for Open GIT"
version.workspace = true
edition.workspace = true

[features]
# Derives `specta::Type` on the public types so a frontend can generate bindings.
specta = ["dep:specta"]

[dependencies]
keyring = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json = "1"
specta = { workspace = true, optional = true }
thiserror = "2"
# Runs the `claude` and `codex` programs without blocking the caller.
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
# The `suggest` example reads the staged changes of a real repository.
open-git-core.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
