name: Release

# Pushing a tag such as `v0.1.0` builds the installers for every platform and
# attaches them to a draft GitHub release, to be reviewed and published by hand.
#
# The release also carries what the installed copies update from: each
# installer signed with `TAURI_SIGNING_PRIVATE_KEY` (a repository secret; its
# public half is in `tauri.conf.json`) and `latest.json`, which the application
# reads at `releases/latest/download/latest.json`. That address only follows
# published releases: the update reaches the users once the draft is published.
#
# Every action is pinned to a commit rather than a tag: this workflow holds the
# signing key, and a tag can be moved to other code. The comment after each
# commit names its version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # An installed copy compares its own version with the one of `latest.json`,
      # both taken from `tauri.conf.json`: a tag without the bump updates nobody.
      - name: The tag is the version of tauri.conf.json
        run: |
          version="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but src-tauri/tauri.conf.json says $version."
            exit 1
          fi

  draft:
    name: Draft release
    needs: version
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      # Created here, once: the build jobs below start together, and when each
      # looked for the release itself, two of them could each create one (v0.2.0
      # came out as two drafts, the installers split between them). A run started
      # again finds the draft of the first attempt.
      - name: The draft every installer goes to
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty"
          }
          id=$(find)
          if [ -z "$id" ]; then
            # The list does not show a release created a moment ago (v0.2.1 found
            # nothing half a second later): its id comes from the creation itself.
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Open GIT $GITHUB_REF_NAME" \
              -f body="See the assets below for the installers." -F draft=true \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::No release could be created for $GITHUB_REF_NAME."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.name == 'macos-arm' && 'aarch64-apple-darwin' || matrix.name == 'macos-intel' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Must be set even when the key has no password, or the build asks for one.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          # Written once by the `updater` job: these jobs run side by side and
          # would overwrite each other's entries.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  updater:
    name: latest.json
    # Only when every installer is there: an update that misses a platform
    # would never reach its users.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write latest.json from the signatures of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/latest-json.mjs "$GITHUB_REF_NAME"
