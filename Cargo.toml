[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2024"

[workspace.dependencies]
open-git-ai = { path = "crates/ai" }
open-git-core = { path = "crates/core" }
open-git-forge = { path = "crates/forge" }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
